services:
  postgres:
    image: postgres:15
    container_name: data_world_cup
    env_file:
      - .env
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - ./db/scripts/run_migrations.sh:/docker-entrypoint-initdb.d/01-run_migrations.sh:ro
      - ./db/scripts/run_dml.sh:/docker-entrypoint-initdb.d/02-run_dml.sh:ro
      - ./db/migrations:/migrations:ro
      - ./db/dml:/dml:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_world_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: data_world_minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data_world_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: data_world_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5 &&
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb local/$${MINIO_BUCKET} 2>/dev/null || true &&
        mc mb local/raw 2>/dev/null || true &&
        mc mb local/processed 2>/dev/null || true &&
        mc mb local/parquet 2>/dev/null || true &&
        mc mb local/images 2>/dev/null || true &&
        exit 0;
    networks:
      - data_world_network

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: fifa-workers
    restart: "no"
    environment: 
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_SECURE: "false"
      CSV_SOURCE_PATH: /raw
    volumes:
      - ./data/raw:/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio: 
        condition: service_healthy
    networks:
        - data_world_network
    command: ["uv", "run", "fifa-worker", "--all"]

  redis:
    image: redis:7-alpine
    container_name: data_world_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - data_world_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data_world_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_use_32+_random_chars}
      ENVIRONMENT: development
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${S3_SECRET_KEY}
      CORS_ORIGIN: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - data_world_network
    restart: unless-stopped

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: data_world_nginx
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - data_world_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  data_world_network:
    driver: bridge


volumes:
    postgres_data:
    minio_data:
    redis_data: